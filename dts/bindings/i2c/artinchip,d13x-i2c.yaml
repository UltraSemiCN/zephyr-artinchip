description: ArtInChip D13x I2C controller

compatible: "artinchip,d13x-i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  resets:
    required: true

  interrupts:
    required: true

  artinchip,stuck-time-cycles:
    type: int
    default: 400
    description: SCL and SDA stuck detection time, in configured bus clock cycles
