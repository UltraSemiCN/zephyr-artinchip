description: |
  ArtInChip QSPI storage metadata owned by pre-boot firmware. This binding
  describes the bus for partition discovery; no runtime driver is provided.
  The controller must remain disabled until a native driver is supplied.
compatible: "artinchip,boot-spi"
include: spi-controller.yaml
properties:
  reg:
    required: true
