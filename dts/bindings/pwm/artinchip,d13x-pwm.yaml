description: ArtInChip D13x PWM controller

compatible: "artinchip,d13x-pwm"

include: [pwm-controller.yaml, pinctrl-device.yaml, reset-device.yaml, base.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  resets:
    required: true

  "#pwm-cells":
    const: 3

  channels:
    const: 4

pwm-cells:
  - channel
  - period
  - flags
