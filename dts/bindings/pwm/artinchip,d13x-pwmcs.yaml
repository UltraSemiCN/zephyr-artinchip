description: ArtInChip D13x enhanced PWM controller
compatible: "artinchip,d13x-pwmcs"
include: [pwm-controller.yaml, reset-device.yaml, base.yaml]
properties:
  reg:
    required: true
  clocks:
    required: true
  channels:
    const: 24
  "#pwm-cells":
    const: 3
pwm-cells:
  - channel
  - period
  - flags
