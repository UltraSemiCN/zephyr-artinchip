description: ArtInChip D12P digital video port receiver

compatible: "artinchip,d12p-dvp"

include: [base.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  data-width:
    type: int
    default: 8
    enum:
      - 8
      - 16
    description: Parallel sensor data bus width in bits.

  hsync-active:
    type: string
    default: "high"
    enum:
      - "low"
      - "high"
    description: Active level of the horizontal reference signal.

  vsync-active:
    type: string
    default: "high"
    enum:
      - "low"
      - "high"
    description: Active level of the vertical sync signal.

  pclk-sample:
    type: string
    default: "rising"
    enum:
      - "rising"
      - "falling"
    description: Pixel clock edge used to sample input data.
