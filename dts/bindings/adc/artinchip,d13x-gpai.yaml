description: ArtInChip D13x general-purpose ADC

compatible: "artinchip,d13x-gpai"

include:
  - adc-controller.yaml
  - pinctrl-device.yaml
  - reset-device.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  artinchip,adcim:
    type: phandle
    required: true
    description: Shared ADC interface manager used for calibration

  channels:
    type: int
    required: true
    description: Number of implemented GPAI channels

  vref-mv:
    type: int
    default: 3000
    description: ADC reference voltage in millivolts

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
