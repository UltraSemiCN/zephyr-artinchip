description: ArtInChip D12P USB 2.0 device controller

compatible: "artinchip,d12p-usbd"

include: usb-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  num-in-eps:
    type: int
    required: true
    description: Number of IN endpoints, including control endpoint zero.

  num-out-eps:
    type: int
    required: true
    description: Number of OUT endpoints, including control endpoint zero.

  clocks:
    required: true

  clock-names:
    type: string-array
    required: true

  resets:
    type: phandle-array
    required: true

  reset-names:
    type: string-array
    required: true

  artinchip,syscfg:
    type: phandle
    required: true
    description: System configuration block containing USB0_CFG DRD mode bit.
