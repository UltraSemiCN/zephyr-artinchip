description: ArtInChip D12p USB 2.0 device controller (Synopsys DWC2 OTG)

compatible: "artinchip,d12p-usbd"

include: ["snps,dwc2.yaml"]

properties:
  clocks:
    required: true

  clock-names:
    type: string-array
    required: true

  resets:
    type: phandle-array
    required: true

  reset-names:
    type: string-array
    required: true

  artinchip,syscfg:
    type: phandle
    required: true
    description: System configuration block containing USB0_CFG DRD mode bit.
