# SPDX-License-Identifier: Apache-2.0
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NAND=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_EX_OP_ENABLED=y
CONFIG_SPI_NAND_BAD_BLOCK_CACHE=n
CONFIG_CLOCK_CONTROL=y
CONFIG_RESET=y
CONFIG_PINCTRL=y
CONFIG_XIP=n
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=32

# Accelerate hashing and signature verification of the RAM-loaded image.
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
